name: Release

# Push a tag v<VERSION> (scripts/release.ps1 makes it) to build the store zip
# (one package for the Chrome Web Store and Edge Add-ons) and publish a
# GitHub release. With the repository variable STORE_PUBLISH set to "true",
# the zip is also uploaded to both stores and submitted for review
# (scripts/publish-stores.mjs); otherwise upload to the stores by hand.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out chrome
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: chrome
          persist-credentials: false

      - name: Check tag matches VERSION
        id: version
        run: |
          version="$(tr -d '\r\n' < chrome/VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2; exit 1; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          ref="$(tr -d '\r\n' < chrome/COMMON_REF 2>/dev/null || echo main)"
          echo "common=${ref}" >> "$GITHUB_OUTPUT"

      - name: Check out common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/NyaPassword-common
          ssh-key: ${{ secrets.COMMON_DEPLOY_KEY }}
          ref: ${{ steps.version.outputs.common }}
          path: common
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Set up Rust and wasm-bindgen
        run: |
          rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
          rustup target add wasm32-unknown-unknown
          v="$(grep -A1 '^name = "wasm-bindgen"$' common/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
          cargo install wasm-bindgen-cli --version "$v" --locked

      - name: Build
        run: |
          (cd common/web && npm ci --no-audit --no-fund && npm run wasm)
          cd chrome
          npm ci --no-audit --no-fund
          npm test
          npm run zip
          mkdir -p ../dist
          cp .output/NyaPassword-Chrome_*.zip ../dist/
          cd ../dist && sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: NyaPassword Chrome ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*

      # Upload to the Chrome Web Store and Edge Add-ons and submit for review.
      # Off until the repository variable STORE_PUBLISH is "true"; prereleases
      # never go to the stores. A store whose secrets are unset is skipped.
      - name: Submit to the stores
        if: vars.STORE_PUBLISH == 'true' && steps.version.outputs.prerelease == 'false'
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CERTIFICATION_NOTES: ${{ secrets.EDGE_CERTIFICATION_NOTES }}
        run: node chrome/scripts/publish-stores.mjs "dist/NyaPassword-Chrome_${{ steps.version.outputs.version }}.zip"
